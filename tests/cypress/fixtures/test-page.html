<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DuckDB-Wasm-Kit Test Page</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        padding: 20px;
        max-width: 800px;
        margin: 0 auto;
      }
      #status {
        padding: 10px;
        border-radius: 5px;
        margin-bottom: 20px;
        background-color: #f0f0f0;
      }
      .success {
        background-color: #d4edda !important;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .error {
        background-color: #f8d7da !important;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
      .warning {
        background-color: #fff3cd !important;
        color: #856404;
        border: 1px solid #ffeeba;
      }
      .info {
        background-color: #d1ecf1 !important;
        color: #0c5460;
        border: 1px solid #bee5eb;
      }
      pre {
        background-color: #f8f9fa;
        padding: 10px;
        border-radius: 5px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <h1>DuckDB-Wasm-Kit Test Page</h1>

    <!-- Status element that the e2e.ts support file is looking for -->
    <div id="status">Initializing DuckDB-Wasm...</div>

    <div id="test-container">
      <h2>Test Controls</h2>
      <button id="run-test">Run Test Query</button>
      <button id="reset">Reset</button>
    </div>

    <div id="results">
      <h2>Test Results</h2>
      <pre id="output">// Results will appear here...</pre>
    </div>

    <script>
      // Global state
      window.__duckdbReady = false;

      // Function to update status that matches the interface expected by e2e.ts
      window.updateStatus = function (message, type) {
        const statusElement = document.getElementById("status");
        if (statusElement) {
          statusElement.textContent = message;
          statusElement.className = type || "";
        }
      };

      // Mock function for saving coverage data
      window.__saveCoverage = function () {
        console.log("Coverage data save requested");
      };

      // Function that can be called after each test
      window.afterCypressTest = function () {
        console.log("After Cypress test hook called");
      };

      // Setup mock DuckDB for testing
      function setupMockDuckDB() {
        // Mock DuckDB instance
        window.duckdbInstance = {
          query: async (sql) => {
            console.log("Query executed:", sql);
            return { type: "mock_result", sql };
          },
          registerFileURL: async () => true,
          registerFileBuffer: async () => true,
          open: async () => true,
          close: async () => true,
        };

        // Mock helper functions
        window.runQuery = async (db, sql) => {
          console.log("Running query:", sql);
          return await db.query(sql);
        };

        window.tableNames = async () => {
          return ["mock_table1", "mock_table2"];
        };

        window.insertFile = async () => {
          console.log("Mock file inserted");
          return true;
        };

        // Mark DuckDB as ready
        window.__duckdbReady = true;
        window.updateStatus("DuckDB-Wasm ready", "success");
      }

      // Initialize on page load
      document.addEventListener("DOMContentLoaded", () => {
        window.updateStatus("Loading test environment...", "info");

        // Simulate loading delay
        setTimeout(() => {
          try {
            setupMockDuckDB();
          } catch (error) {
            console.error("Error setting up mock DuckDB:", error);
            window.__duckdbInitFailed = true;
            window.__duckdbInitError = error.toString();
            window.updateStatus("Failed to initialize DuckDB-Wasm: " + error, "error");
          }
        }, 500);

        // Set up button handlers
        document.getElementById("run-test").addEventListener("click", async () => {
          if (!window.__duckdbReady) {
            window.updateStatus("DuckDB not ready yet", "warning");
            return;
          }

          try {
            const result = await window.runQuery(
              window.duckdbInstance,
              "SELECT 'test' AS hello",
            );
            document.getElementById("output").textContent = JSON.stringify(
              result,
              null,
              2,
            );
            window.updateStatus("Test query executed successfully", "success");
          } catch (error) {
            document.getElementById("output").textContent = "Error: " + error.toString();
            window.updateStatus("Error running query: " + error, "error");
          }
        });

        document.getElementById("reset").addEventListener("click", () => {
          document.getElementById("output").textContent =
            "// Results will appear here...";
          window.updateStatus("Environment reset", "info");
        });
      });
    </script>
  </body>
</html>
