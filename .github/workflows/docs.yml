name: Documentation

on:
  # Comment out these triggers to disable the workflow
  # push:
  #   branches: [ main ]
  # pull_request:
  #   branches: [ main ]
  
  # Or use workflow_dispatch to only run manually
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install
        
      - name: Build documentation
        run: pnpm docs
        
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs
          branch: gh-pages
          clean: true
